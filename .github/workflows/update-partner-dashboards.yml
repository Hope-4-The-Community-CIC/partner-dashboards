name: Refresh partner dashboards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: partner-dashboard-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh all configured partner dashboards
        run: python scripts/update_partner_dashboards.py

           - name: Commit refreshed data
        run: |
          git config user.name "hope-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -- '*/data.json'
          git diff --cached --quiet || git commit -m "Refresh partner dashboard data"

          git pull --rebase origin main
          git push
