name: Update self-guided dashboard

on:
  repository_dispatch:
    types: [update-self-guided]

permissions:
  contents: write

concurrency:
  group: partner-dashboard-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync with latest main
        run: |
          git config user.name "hope-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main

      - name: Update self-guided data
        env:
          DASHBOARD_KEY: ${{ github.event.client_payload.dashboard_key }}
          LATEST_DATE: ${{ github.event.client_payload.latest_date }}
          WEEKLY_UPTAKE: ${{ github.event.client_payload.weekly_uptake }}
          ENROLLED_TOTAL: ${{ github.event.client_payload.enrolled_total }}
          QUOTA: ${{ github.event.client_payload.quota }}
        run: |
          python scripts/update_self_guided.py

      - name: Commit updated dashboard
        run: |
          git add -- '*/data.json'

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git commit -m "Update self-guided dashboard"

      - name: Push with retry
        run: |
          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt"

            if git push origin main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed. Syncing with latest main before retry..."

            git pull --rebase origin main

            sleep 3
          done

          echo "Push failed after 5 attempts."
          exit 1
